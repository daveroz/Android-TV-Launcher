name: Build APK
# Builds Deco Launcher on every push that touches it (and on demand from the Actions tab).
# Every run uploads the APK as an artifact (DecoLauncher.apk). Runs on the default branch that are signed with the
# fixed key also publish it to the "launcher-latest" release, which gives a stable download link:
# https://github.com/daveroz/Cam-deco/releases/download/launcher-latest/DecoLauncher.apk
on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write # to publish the APK on the release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The repository secret DECO_KEYSTORE_BASE64 holds the signing key (see launcher/README.md).
      # Without it the APK is signed with a throwaway key, so it can't install over an existing one.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.DECO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/deco.keystore"
            echo "DECO_KEYSTORE_FILE=$RUNNER_TEMP/deco.keystore" >> "$GITHUB_ENV"
            echo "SIGNED_WITH_FIXED_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::The DECO_KEYSTORE_BASE64 secret isn't set, so this APK is signed with a throwaway key and won't be published to the release. See launcher/README.md."
          fi

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest

      - name: Assemble release APK
        env:
          DECO_KEYSTORE_PASSWORD: ${{ secrets.DECO_KEYSTORE_PASSWORD }}
          DECO_KEY_ALIAS: ${{ secrets.DECO_KEY_ALIAS }}
          DECO_KEY_PASSWORD: ${{ secrets.DECO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk DecoLauncher.apk

      - name: Show version and signing key
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          echo "DECO_VERSION=$version" >> "$GITHUB_ENV"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo "### Deco Launcher $version"
            echo '```'
            "$apksigner" verify --print-certs DecoLauncher.apk | grep 'SHA-256'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          path: launcher/DecoLauncher.apk
          archive: false # download the APK itself, not a zip

      - name: Publish to the launcher-latest release
        if: env.SIGNED_WITH_FIXED_KEY == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Deco Launcher $DECO_VERSION"
          notes="Built from ${GITHUB_SHA::7}. Install over the current version with: adb install -r DecoLauncher.apk"
          if gh release view launcher-latest > /dev/null 2>&1; then
            gh release upload launcher-latest DecoLauncher.apk --clobber
            gh release edit launcher-latest --title "$title" --notes "$notes"
          else
            gh release create launcher-latest DecoLauncher.apk --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
