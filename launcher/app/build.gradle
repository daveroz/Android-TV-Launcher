plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camdeco.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.camdeco.launcher'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.18'
    }

    // Every build must be signed with the same key, or Android refuses to install it over the
    // last one. GitHub Actions passes that key in DECO_KEYSTORE_FILE (from a repository secret);
    // without it, builds fall back to the build machine's own debug key.
    def keystore = System.getenv('DECO_KEYSTORE_FILE')
    signingConfigs {
        if (keystore) {
            fixed {
                storeFile file(keystore)
                storePassword System.getenv('DECO_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('DECO_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('DECO_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystore ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.leanback:leanback-grid:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
